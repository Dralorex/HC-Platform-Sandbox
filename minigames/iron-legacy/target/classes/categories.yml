# Server-defined categories for HCIronLegacy build/dig rule system.
# You can reference categories in-game:
#   /il build add category:<name>
#   /il dig remove cat:<name>
#
# A category can contain:
#   - Bukkit Tags:  "tag:<TAG_NAME>" (case-insensitive). Examples: tag:LOGS, tag:PLANKS, tag:WOOL
#   - Explicit materials: "STONE", "OAK_LOG", ...
#
# Notes:
# - Only valid block materials will be used when categories resolve.
# - You can combine tags and materials in the same category.
# - Use /il rules to see a summary of rules (build/dig/crafting, modes, sizes, etc.)
#
# Some widely useful Bukkit tags (not exhaustive) include:
# LOGS, PLANKS, WOOL, CARPETS, LEAVES, SAPLINGS, STAIRS, SLABS, FENCES, FENCE_GATES, DOORS,
# TRAPDOORS, BUTTONS, PRESSURE_PLATES, WOODEN_BUTTONS, WOODEN_DOORS, WOODEN_TRAPDOORS,
# WOODEN_PRESSURE_PLATES, SIGNS, WALL_SIGNS, BANNERS, WALL_BANNERS, GLASS_BLOCKS, GLASS_PANES,
# SAND, TERRACOTTA, CONCRETE, CONCRETE_POWDER, STONE_BRICKS, ANVIL, RAILS, CANDLES, CANDLES_CAKES
# (Availability varies by MC version; unknown tags are ignored safely.)

categories:

