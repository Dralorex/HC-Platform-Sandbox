name: HCIronLegacy
version: '1.21.4-a0.3.0'
main: com.hollowcrown.hungergames.HungerGamesPlugin
api-version: '1.21'
load: POSTWORLD
depend: [HC-Foundation, HollowCrownHub]
authors: [Dralorex, HollowCrownStudio ]
website: https://example.com
commands:
  il:
    description: HCIronLegacy admin/player command
    usage: /il help
    aliases: [ironlegacy]
    permission: hcironlegacy.use
permissions:
  hcironlegacy.use:
    default: true
  hcironlegacy.admin:
    default: op
