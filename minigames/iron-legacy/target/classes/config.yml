# =========================
# HCIronLegacy - Core config
# =========================

game:
  # Max players per team. Editable: /il set teamsize <n>
  teamSize: 2

  # Hard-freeze countdown (players cannot move). Editable: /il set countdown <seconds>
  countdownSeconds: 30

  # Fallback title color (dynamic colors take over during the countdown).
  # Editable: /il set titlecolor <ChatColor>
  countdownColor: GOLD

  # Launch height used to punish movement during hard-freeze. Editable: /il set penaltyheight <blocks>
  freezePenaltyHeight: 100

  # If true, freeze punishment launches and kills players (legacy behavior).
  # Default false = teleport to pad + half-heart damage every 0.5s when moving.
  launchOnMove: false

  # Toggle vanilla death messages suppression. Editable: /il toggle deathmsgs
  suppressDeathMessages: true

  # Play cannon boom when a player dies. Editable: /il toggle cannon
  playCannonOnDeath: true

  # If true, OPs are included as game participants at start.
  includeOpsInGame: false

  # If true, counted players stay Adventure when match starts (blocks remain protected).
  keepAdventureOnStart: false

# =========================
# Hollow Crown Hub (optional)
# Requires HC-Foundation + HollowCrownHub. Hub spawn: /hch sethub on the hub server.
# =========================
integrations:
  # If true, append Hub templates (mechanic iron-legacy) that are missing from worlds.yml to
  # compass / admin lists so you do not duplicate every template row in IL when Hub owns registration.
  mergeHubTemplatesIntoList: true
  # If true, match instances are created by Hollow Crown Hub on this same server (folder copy + load)
  # before IL falls back to local snapshot cloning. Use false when game servers do not co-host Hub.
  preferHubMatchInstanceProvisioning: false

ui:
  # If true, /il teams opens Teams menu first instead of the main menu. Editable: /il toggle defaultteams
  openTeamsFirst: false

# Legacy keys (optional): migrated into plugins/HollowCrownHub/hub-world.yml and lobby.yml by HC-Hub / IL.
lobby:
  world: ""
  x: 0.0
  y: 0.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0
  size: 64.0
  pvpSwordMaterial: IRON_SWORD

worldborder:
  # Starting/max border size at game start.
  startSize: 1500.0

  # Target/min border size once fully shrunk.
  endSize: 200.0

  # Seconds after game start before the border begins shrinking.
  shrinkDelaySeconds: 300

  # Seconds it takes to shrink from startSize to endSize.
  shrinkDurationSeconds: 600

# =========================
# Rules: Build / Dig / Craft
# Fully controllable in-game:
#   /il crafting <on|off>
#   /il build <enable|disable|mode|add|remove|list>
#   /il build mode <whitelist|blacklist>
#   /il build add/remove <MATERIAL> | category:<name>
#   /il dig   <enable|disable|mode|add|remove|list>
#   /il dig mode <whitelist|blacklist>
#   /il dig add/remove <MATERIAL> | category:<name>
#
# NOTE 1: Categories are defined in categories.yml (same folder as this file).
#         Use /il build|dig add category:<name> to expand a category into your lists.
# NOTE 2: Default mode is WHITELIST (safer): only listed items are allowed.
# =========================
rules:
  # If true, OPs always bypass build/dig rule checks. If false, OPs follow normal rules.
  opsBypassBuildDig: true

  crafting:
    enabled: true

  build:
    enabled: true
    mode: whitelist   # whitelist | blacklist
    list: [ ]         # MATERIAL names only; add via commands or categories

  dig:
    enabled: true
    mode: whitelist   # whitelist | blacklist
    list: [ ]         # MATERIAL names only; add via commands or categories

# =========================
# Categories (definition lives in categories.yml)
# - Do NOT edit categories here.
# - Use /il build|dig add category:<name> to add a whole group to your lists.
# Examples (after you provide categories.yml):
#   /il build add category:logs
#   /il dig add category:stone
# =========================

# =========================
# Hooks (console commands)
# Supports optional delays with: delay:<ticks>:/command
# Example below starts Crazy Envoys ~30s (600 ticks) after game start.
# =========================
#hooks:
#  onGameStart:
#    - "delay:600:/envoy start"
#  onGameEnd: [ ]

# =========================
# Spawn pads (managed in-game)
# Kept for persistence; do not edit by hand.
# =========================
spawns:
  pads: [ ]  # serialized locations world,x,y,z,yaw,pitch

# =========================
# Limbo / lobby team display names — substring block list (case-insensitive).
# =========================
limboTeamNaming:
  blockedWords: [ ]

# =========================
# Teams (persisted here)
# Managed by GUI/commands; editing by hand not recommended.
# =========================
teams: { }
