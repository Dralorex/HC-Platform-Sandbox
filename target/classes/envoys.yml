timing:
  spawnIntervalSeconds: 180
  nextWaveDelaySeconds: 5
  spawnBatchSize: 10
  fallSpeedBlocksPerTick: 0.08
  beepIntervalSeconds: 30
  beepRadius: 24
  fallingBeepRadiusMultiplier: 1.5
  audioFalloff:
    maxVolumeRadius: 5.0    # Within this radius, volume is at max
    minVolumeRadius: 50.0   # Beyond this radius, volume is 0
    maxVolume: 1.0          # Maximum volume (0.0-1.0)
  spawnRadiusFromPoint: 50
  giftDropRadiusFromPlayer: 5
  spawnHeightAboveTarget: 50  # How many blocks above landing spot to spawn (default 50)
visual:
  parachuteEnabled: true  # Enable/disable parachute visual for falling crates
wave:
  minPerWave: 3
  maxPerWave: 10
  randomForager:
    enabled: false
    minDrops: 1
    maxDrops: 3
types:
  default: BLOCKS
  priority:
    FOOD: 10.0
    BLOCKS: 10.0
    TOOLS: 5.0
    WEAPONS: 2.0
    KITS: 1.0
tiers:
  enabled: false
  allowed: [T1, T2, T3, T4]
  T1: { weight: 10.0, name: "Tier 1" }
  T2: { weight: 5.0, name: "Tier 2" }
  T3: { weight: 2.0, name: "Tier 3" }
  T4: { weight: 1.0, name: "Tier 4" }
  FOOD:
    packages:
      - items:
          - { material: COOKED_BEEF, min: 4, max: 12 }
          - { material: BREAD, min: 4, max: 12 }
      - items:
          - { material: COOKED_CHICKEN, min: 6, max: 14 }
          - { material: GOLDEN_CARROT, min: 2, max: 6 }
  WEAPONS:
    packages:
      - items:
          - { material: IRON_SWORD, min: 1, max: 1 }
          - { material: ARROW, min: 12, max: 32 }
      - items:
          - { material: BOW, min: 1, max: 1 }
          - { material: ARROW, min: 16, max: 48 }
  BLOCKS:
    packages:
      - items:
          - { material: COBBLESTONE, min: 16, max: 48 }
          - { material: OAK_PLANKS, min: 16, max: 48 }
  TOOLS:
    packages:
      - items:
          - { material: IRON_PICKAXE, min: 1, max: 1 }
          - { material: IRON_AXE, min: 1, max: 1 }
  KITS:
    packages:
      - items:
          - { material: SHIELD, min: 1, max: 1 }
          - { material: GOLDEN_APPLE, min: 1, max: 2 }

