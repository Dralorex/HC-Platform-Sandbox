# HollowCrownHub — optional MySQL hot store (parties, lobby instances, match queues).
# When storage.type is YAML (default), all hot data uses plugin folder YAML only.
#
# If storage.type=MYSQL and JDBC fails at startup, the plugin logs SEVERE and falls back to YAML-only.
storage:
  type: YAML
  # type: MYSQL
  mysql:
    host: localhost
    port: 3306
    database: hollowcrown_hub
    username: hub
    password: ""
    poolSize: 4
    connectionTimeoutMs: 10000
    # Appended to jdbc:mysql://host:port/database?
    jdbcUrlParams: "useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"

# Hub parties (/hch party …); persisted in plugins/HollowCrownHub/parties.yml
# When MySQL is active, parties + pending invites are also mirrored to hc_party* tables.
party:
  inviteTtlSeconds: 300
  allOfflineDisbandSeconds: 180
  leaderAbandonedPromoteSeconds: 180

# Lobby layout wand writes lobby.zone + lobby spawn under this plugin's data folder:
#   plugins/<ironLegacy.pluginName>/worlds.yml
ironLegacy:
  pluginName: HCIronLegacy

# Match teams (lobby-only; reset each lobby/match). Cap in lobby uses template teamSizeMax.
teams:
  memberCap: 4

# Drop a Minecraft world into hch-worlds/templates/<name> — on startup Hub + IL register it automatically.
# Missing folders are removed from templates.yml / worlds.yml / lobbies / queues on startup.
templates:
  autoDiscoverOnStartup: true
  pruneMissingOnStartup: true

# Set in-game with /hch sethub [1] (writes world-uuid + coords). Hub #1 = /hub and /hub join 1.
# Extra hubs: /hch sethub 2, /hch sethub 3, … (writes hub.instances.<n> below).
hub:
  # Max players per numbered hub instance before overflow to the next hub (/hub party pull, match end).
  instanceCapacity: 20
  spawn: {}
  # Optional extra hub spawns (/hub join 2, /hub join 3, …). Prefer /hch sethub <n> in-game.
  # instances:
  #   "2":
  #     world-uuid: "00000000-0000-0000-0000-000000000000"
  #     x: 0.5
  #     y: 64.0
  #     z: 0.5
  #     yaw: 0.0
  #     pitch: 0.0

# =========================
# Lobby / lobby team display names — substring block list (case-insensitive).
# =========================
lobbyTeamNaming:
  blockedWords: [ ]